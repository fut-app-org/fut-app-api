name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # job release (reusable workflow) publica imagem no GHCR

concurrency:
  group: fut-app-api-production
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l .)"
      - run: bash -n scripts/*.sh
      - run: go vet ./...
      - run: go test ./...
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: futapp
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: futapp
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build


  # Release via reusable workflow do vps-infra: build+push GHCR por digest +
  # deploy via chave confinada deploy-fut-app. Gateado por DEPLOY_ENABLED.
  release:
    needs: [backend, compose]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    uses: Arthur-Queiroz/vps-deploy/.github/workflows/app-deploy.yml@main
    with:
      app-id: fut-app
      service: api
      image-repo: fut-app-org/fut-app-api
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
